<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keja Yangu | Student Housing</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --navy: #1a237e; --red: #d32f2f; --bg: #f4f7f9; --success: #25d366; --blue-tick: #2196F3; --gold: #ffc107; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 80px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; margin-bottom: 20px; }
        input, select, .btn { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .btn-primary { background: var(--navy); color: white; border: none; font-weight: bold; cursor: pointer; }
        
        /* Scam Warning */
        .scam-banner { background: #fff3cd; color: #856404; padding: 10px; border-radius: 10px; font-size: 0.8rem; border: 1px solid #ffeeba; margin-bottom: 15px; text-align: center; }

        /* House Card */
        .house-card { background: white; border-radius: 18px; overflow: hidden; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); position: relative; }
        .house-img { width: 100%; height: 210px; object-fit: cover; }
        .house-info { padding: 15px; }
        .price { color: var(--red); font-size: 1.3rem; font-weight: 800; }
        
        /* Interaction Icons */
        .card-actions { display: flex; gap: 15px; margin: 10px 0; font-size: 1.2rem; }
        .heart-icon { color: var(--red); cursor: pointer; }
        .verified-tick { color: var(--blue-tick); margin-left: 5px; }

        /* Reviews */
        .review-section { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 0.85rem; }
        .review-item { border-bottom: 1px solid #eee; padding: 5px 0; }

        /* Admin Controls */
        .admin-box { background: #fff; border: 2px solid gold; padding: 15px; border-radius: 15px; margin-top: 20px; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; padding: 8px 0; border-bottom: 1px solid #eee; }
        
        /* Tabs for Student */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: #ddd; cursor: pointer; }
        .tab-active { background: var(--navy); color: white; }

        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; padding: 10px;">
        <img src="https://i.ibb.co/3mKNG8nV/House-logo.png" style="width:70px; border-radius:10px;">
        <h2 style="color:var(--navy); margin:5px 0;">KEJA YANGU</h2>
    </div>

    <div id="auth-screen" class="card" style="display: block;">
        <div class="scam-banner">⚠️ <strong>SECURITY ALERT:</strong> Never pay any deposit or booking fee before visiting the house. Payments are NOT done on this platform.</div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <select id="role">
            <option value="student">Student</option>
            <option value="landlord">Landlord</option>
        </select>
        <button onclick="authAction('login')" class="btn btn-primary">Sign In</button>
        <button onclick="authAction('signup')" class="btn" style="background:none; border:1px solid var(--navy);">Register</button>
    </div>

    <div id="student-screen" class="card">
        <div class="tabs">
            <button id="tab-all" class="tab-btn tab-active" onclick="switchTab('all')">All Houses</button>
            <button id="tab-liked" class="tab-btn" onclick="switchTab('liked')">My Likes ❤️</button>
        </div>
        
        <div class="scam-banner">🚫 NO online payments. Visit the house first!</div>
        <input type="text" id="search" placeholder="🔍 Search houses..." onkeyup="drawMarket()">
        
        <div id="market-list"></div>

        <div id="admin-panel" style="display:none;" class="admin-box">
            <h4 style="margin-top:0;">🛡️ Admin Control Room</h4>
            <div id="admin-user-list"></div>
            <hr>
            <div id="admin-reports"></div>
        </div>

        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; font-weight:bold;">Logout</button>
    </div>

    <div id="landlord-screen" class="card">
        <h3>Post House</h3>
        <input type="text" id="h-name" placeholder="House Name">
        <input type="number" id="h-price" placeholder="Price">
        <input type="text" id="h-phone" placeholder="WhatsApp Number">
        <input type="text" id="h-dist" placeholder="Distance (e.g. 500m)">
        <input type="text" id="h-img" placeholder="Image URL">
        <button onclick="saveHouse()" class="btn btn-primary">Publish</button>
        <hr>
        <div id="landlord-list"></div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none;">Logout</button>
    </div>

    <footer>&copy; 2025 Keja Yangu Murang'a</footer>
</div>

<script>
    const ADMIN_EMAIL = "jonahnjugi100@gmail.com";
    const firebaseConfig = {
        apiKey: "AIzaSyCC8SA7FKzikzHwvA9A6dyrv0x2jguyPPQ",
        authDomain: "murang-a-student-housing.firebaseapp.com",
        projectId: "murang-a-student-housing",
        storageBucket: "murang-a-student-housing.appspot.com",
        messagingSenderId: "340466154926",
        appId: "1:340466154926:web:ea439a7f40ea64a13d5c3f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let houses = [];
    let usersMap = {};
    let myLikes = [];
    let currentTab = 'all';

    auth.onAuthStateChanged(async user => {
        document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        if(!user) {
            document.getElementById('auth-screen').style.display = 'block';
        } else {
            // Everyone uses the Student screen to view, including Admin
            const userDoc = await db.collection('users').doc(user.uid).get();
            const role = userDoc.exists ? userDoc.data().role : 'student';
            
            if(user.email === ADMIN_EMAIL || role === 'student') {
                document.getElementById('student-screen').style.display = 'block';
                if(user.email === ADMIN_EMAIL) {
                    document.getElementById('admin-panel').style.display = 'block';
                    loadAdminData();
                }
            } else {
                document.getElementById('landlord-screen').style.display = 'block';
            }
            loadBaseData();
        }
    });

    function loadBaseData() {
        db.collection('users').onSnapshot(snap => {
            snap.forEach(doc => usersMap[doc.id] = doc.data());
            db.collection('houses').orderBy('createdAt', 'desc').onSnapshot(hSnap => {
                houses = hSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                drawMarket();
                if(document.getElementById('landlord-list')) drawLandlordList();
            });
        });
        db.collection('likes').doc(auth.currentUser.uid).onSnapshot(doc => {
            myLikes = doc.exists ? doc.data().houseIds : [];
            drawMarket();
        });
    }

    function drawMarket() {
        const list = document.getElementById('market-list');
        const query = document.getElementById('search').value.toLowerCase();
        list.innerHTML = "";

        houses.filter(h => {
            const matchesSearch = h.name.toLowerCase().includes(query);
            const matchesTab = (currentTab === 'all') || (currentTab === 'liked' && myLikes.includes(h.id));
            return matchesSearch && matchesTab;
        }).forEach(h => {
            const isV = usersMap[h.ownerId]?.isVerified;
            const isLiked = myLikes.includes(h.id);
            const isAdmin = auth.currentUser.email === ADMIN_EMAIL;

            list.innerHTML += `
                <div class="house-card">
                    <img src="${h.img || ''}" class="house-img">
                    <div class="house-info">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="price">Ksh ${h.price}</span>
                            <span>${h.name} ${isV ? '<b class="verified-tick">✔</b>' : ''}</span>
                        </div>
                        <div class="card-actions">
                            <span onclick="toggleLike('${h.id}')" class="heart-icon">${isLiked ? '❤️' : '🤍'}</span>
                            <a href="https://wa.me/${h.phone}" style="text-decoration:none;">💬</a>
                            ${isAdmin ? `<button onclick="deleteListing('${h.id}')" style="background:none; border:none; color:red; cursor:pointer;">🗑️ Delete</button>` : ''}
                        </div>
                        <div style="font-size:0.8rem; color:#666;">📍 ${h.dist}</div>
                        
                        <div class="review-section">
                            <input type="text" id="rev-${h.id}" placeholder="Write a review..." style="padding:5px; font-size:0.7rem; width:70%;">
                            <button onclick="addReview('${h.id}')" style="width:25%; font-size:0.7rem; padding:5px;">Post</button>
                            <div id="reviews-${h.id}">Loading reviews...</div>
                        </div>
                    </div>
                </div>`;
            loadReviews(h.id);
        });
    }

    // INTERACTION LOGIC
    async function toggleLike(hid) {
        let newLikes = [...myLikes];
        if(newLikes.includes(hid)) newLikes = newLikes.filter(id => id !== hid);
        else newLikes.push(hid);
        await db.collection('likes').doc(auth.currentUser.uid).set({ houseIds: newLikes });
    }

    async function addReview(hid) {
        const txt = document.getElementById('rev-'+hid).value;
        if(!txt) return;
        await db.collection('houses').doc(hid).collection('reviews').add({
            text: txt,
            user: auth.currentUser.email,
            createdAt: new Date()
        });
        document.getElementById('rev-'+hid).value = "";
    }

    function loadReviews(hid) {
        db.collection('houses').doc(hid).collection('reviews').orderBy('createdAt','desc').limit(3).onSnapshot(snap => {
            const div = document.getElementById('reviews-'+hid);
            div.innerHTML = "";
            snap.forEach(doc => {
                div.innerHTML += `<div class="review-item"><b>${doc.data().user.split('@')[0]}:</b> ${doc.data().text}</div>`;
            });
        });
    }

    // ADMIN DASHBOARD LOGIC
    function loadAdminData() {
        db.collection('users').where('role', '==', 'landlord').onSnapshot(snap => {
            const list = document.getElementById('admin-user-list');
            list.innerHTML = "<h5>Verify Landlords</h5>";
            snap.forEach(doc => {
                const u = doc.data();
                list.innerHTML += `<div class="admin-row">
                    <span>${u.email}</span>
                    <button onclick="updateVerify('${doc.id}', ${!u.isVerified})">${u.isVerified ? '✅ Verified' : '❌ Unverified'}</button>
                </div>`;
            });
        });
    }

    function updateVerify(uid, status) { db.collection('users').doc(uid).update({ isVerified: status }); }
    function deleteListing(hid) { if(confirm("Delete this fake listing?")) db.collection('houses').doc(hid).delete(); }

    // TAB LOGIC
    function switchTab(t) {
        currentTab = t;
        document.getElementById('tab-all').className = t === 'all' ? 'tab-btn tab-active' : 'tab-btn';
        document.getElementById('tab-liked').className = t === 'liked' ? 'tab-btn tab-active' : 'tab-btn';
        drawMarket();
    }

    // BASE FUNCTIONS
    async function saveHouse() {
        const h = {
            name: document.getElementById('h-name').value,
            price: document.getElementById('h-price').value,
            phone: document.getElementById('h-phone').value.replace(/\D/g,''),
            dist: document.getElementById('h-dist').value,
            img: document.getElementById('h-img').value,
            ownerId: auth.currentUser.uid,
            createdAt: new Date()
        };
        await db.collection('houses').add(h);
        alert("Posted!");
    }

    function authAction(type) {
        const e = document.getElementById('email').value, p = document.getElementById('pass').value, r = document.getElementById('role').value;
        if(type === 'login') auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        else auth.createUserWithEmailAndPassword(e, p).then(res => db.collection('users').doc(res.user.uid).set({ email: e, role: r, isVerified: false }));
    }
</script>
</body>
</html>
