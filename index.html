<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keja Yangu | Review & Rating Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #039be5; --dark: #263238; --bg: #f4f7f9; --success: #4caf50; --whatsapp: #25d366; --danger: #ff5252; --warning: #ffb300; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; display: none; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; width: auto; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; }
        .btn-whatsapp { background: var(--whatsapp); color: white; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; text-decoration: none; display: inline-block; }
        .btn-danger { background: var(--danger); color: white; margin-top: 20px; }
        .btn-small-danger { background: #ffebee; color: #c62828; padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #ef9a9a; }

        .data-container { text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .house-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 6px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .amenity-tag { font-size: 0.65rem; background: #e1f5fe; color: #01579b; padding: 2px 6px; border-radius: 4px; margin-right: 4px; display: inline-block; }
        .rating-star { color: var(--warning); font-weight: bold; }
        .review-box { font-size: 0.8rem; background: #fff; padding: 8px; border-radius: 5px; margin-top: 5px; border: 1px solid #eee; }
        .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
        .pending { background: #fff3e0; color: #ef6c00; }
        .approved { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    <div id="auth-screen" class="card" style="display: block;">
        <h1>Keja Yangu</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <select id="role">
            <option value="student">I am a Student</option>
            <option value="landlord">I am a Landlord</option>
        </select>
        <button onclick="handleLogin()" class="btn btn-primary">Sign In</button>
        <button onclick="handleSignUp()" class="btn">Register</button>
    </div>

    <div id="student-screen" class="card">
        <h2>Student Dashboard</h2>
        <input type="text" id="search-input" placeholder="🔍 Search houses..." onkeyup="filterHouses()">
        
        <div class="data-container" style="background: #e1f5fe;">
            <h4 style="margin:0">My Bookings & Reviews</h4>
            <div id="student-bookings">No requests.</div>
        </div>
        
        <div class="data-container">
            <h4>Available Properties</h4>
            <div id="student-house-list">Loading...</div>
        </div>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>

    <div id="landlord-screen" class="card">
        <h2>Landlord Portal</h2>
        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: left;">
            <h4 style="margin:0 0 10px 0">New Listing</h4>
            <input type="text" id="h-name" placeholder="House Name">
            <input type="number" id="h-price" placeholder="Rent (Ksh)">
            <input type="text" id="h-phone" placeholder="WhatsApp (254...)">
            <div style="font-size: 0.8rem;"><input type="checkbox" id="wifi"> Wi-Fi | <input type="checkbox" id="water"> Water | <input type="checkbox" id="security"> Security</div>
            <button onclick="addNewHouse()" class="btn btn-primary">Post Property</button>
        </div>
        <div class="data-container" style="background: #e8f5e9;">
            <h4>Manage Requests</h4>
            <div id="landlord-bookings">No requests.</div>
        </div>
        <div class="data-container">
            <h4>Your Listings</h4>
            <div id="landlord-house-list">Loading...</div>
        </div>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCC8SA7FKzikzHwvA9A6dyrv0x2jguyPPQ",
            authDomain: "murang-a-student-housing.firebaseapp.com",
            projectId: "murang-a-student-housing",
            storageBucket: "murang-a-student-housing.appspot.com",
            messagingSenderId: "340466154926",
            appId: "1:340466154926:web:ea439a7f40ea64a13d5c3f"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let allHouses = [];

        auth.onAuthStateChanged(async (user) => {
            document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists && doc.data().role === 'landlord') {
                    document.getElementById('landlord-screen').style.display = 'block';
                    loadLandlordBookings(); loadHouses(true);
                } else {
                    document.getElementById('student-screen').style.display = 'block';
                    loadHouses(false); loadStudentBookings(user.email);
                }
            } else { document.getElementById('auth-screen').style.display = 'block'; }
        });

        async function addNewHouse() {
            const h = { houseName: document.getElementById('h-name').value, price: document.getElementById('h-price').value, phone: document.getElementById('h-phone').value, amenities: [] };
            if(document.getElementById('wifi').checked) h.amenities.push("Wi-Fi");
            if(document.getElementById('water').checked) h.amenities.push("Water");
            if(document.getElementById('security').checked) h.amenities.push("Security");
            await db.collection('houses').add(h); location.reload();
        }

        async function loadHouses(isAdmin) {
            const snap = await db.collection('houses').get();
            allHouses = [];
            for (let doc of snap.docs) {
                let data = doc.data(); data.id = doc.id;
                const revSnap = await db.collection('reviews').where('houseId', '==', doc.id).get();
                data.reviews = revSnap.docs.map(d => d.data());
                allHouses.push(data);
            }
            renderHouses(allHouses, isAdmin);
        }

        function renderHouses(houses, isAdmin) {
            let html = "";
            houses.forEach(h => {
                const amens = h.amenities ? h.amenities.map(a => `<span class="amenity-tag">${a}</span>`).join('') : '';
                const revs = h.reviews ? h.reviews.map(r => `<div class="review-box"><span class="rating-star">★ ${r.stars}</span>: ${r.comment}</div>`).join('') : '';
                html += `<div class="house-card">
                    <div style="text-align:left">
                        <strong>${h.houseName}</strong> - Ksh ${h.price}<br>
                        ${amens}<br>${revs}
                    </div>
                    <div style="margin-top:10px">
                        ${isAdmin ? `<button class="btn-small-danger" onclick="deleteHouse('${h.id}')">Delete</button>` : 
                        `<button class="btn-success" onclick="bookHouse('${h.id}', '${h.houseName}')">Book</button>
                         <a href="https://wa.me/${h.phone}" target="_blank" class="btn-whatsapp">Chat</a>`}
                    </div>
                </div>`;
            });
            document.getElementById(isAdmin ? 'landlord-house-list' : 'student-house-list').innerHTML = html || "Empty.";
        }

        async function bookHouse(id, name) {
            await db.collection('bookings').add({ studentEmail: auth.currentUser.email, houseId: id, houseName: name, status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Request Sent!");
        }

        function loadStudentBookings(email) {
            db.collection('bookings').where('studentEmail', '==', email).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const b = doc.data();
                    html += `<div class="house-card">
                        <span>${b.houseName} <span class="status-badge ${b.status}">${b.status}</span></span>
                        ${b.status === 'approved' ? `
                            <div style="margin-top:10px; border-top:1px solid #eee; padding-top:5px;">
                                <select id="star-${doc.id}"><option value="5">5 Stars</option><option value="4">4 Stars</option><option value="1">1 Star</option></select>
                                <textarea id="comm-${doc.id}" placeholder="Your review..."></textarea>
                                <button class="btn-primary" onclick="submitReview('${b.houseId}', '${doc.id}')" style="padding:5px; font-size:0.7rem;">Submit Review</button>
                            </div>` : ''}
                    </div>`;
                });
                document.getElementById('student-bookings').innerHTML = html || "No bookings.";
            });
        }

        async function submitReview(houseId, bookingId) {
            const stars = document.getElementById(`star-${bookingId}`).value;
            const comment = document.getElementById(`comm-${bookingId}`).value;
            await db.collection('reviews').add({ houseId, stars, comment });
            alert("Thanks for your review!");
            loadHouses(false);
        }

        function loadLandlordBookings() {
            db.collection('bookings').onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const b = doc.data();
                    html += `<div class="booking-card">
                        <span><strong>${b.studentEmail}</strong><br>${b.houseName}</span>
                        ${b.status === 'pending' ? `<button class="btn-success" onclick="approve('${doc.id}')">Approve</button>` : `<span class="status-badge approved">Approved</span>`}
                    </div>`;
                });
                document.getElementById('landlord-bookings').innerHTML = html || "No requests.";
            });
        }

        async function approve(id) { await db.collection('bookings').doc(id).update({ status: 'approved' }); }
        async function deleteHouse(id) { if(confirm("Delete?")) { await db.collection('houses').doc(id).delete(); loadHouses(true); } }
        function filterHouses() { const term = document.getElementById('search-input').value.toLowerCase(); renderHouses(allHouses.filter(h => h.houseName.toLowerCase().includes(term)), false); }
        function handleLogin() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message)); }
        async function handleSignUp() {
            const res = await auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(e => alert(e.message));
            if(res) await db.collection('users').doc(res.user.uid).set({ email: document.getElementById('email').value, role: document.getElementById('role').value });
        }
        function logout() { auth.signOut(); }
    </script>
</body>
</html>
