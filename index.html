<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keja Yangu | Premium MUT Housing</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --midnight: #0a0e17; 
            --gold: #d4af37; 
            --dark-gold: #aa841e;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #e2e8f0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2c 100%); 
            color: var(--text); 
            margin: 0; padding-bottom: 90px;
            min-height: 100vh;
        }

        /* --- Header --- */
        .app-header { 
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { color: var(--gold); font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; }

        .container { max-width: 450px; margin: 0 auto; padding: 20px; }
        .view-section { display: none; animation: fadeIn 0.5s ease; }

        /* --- Premium Cards --- */
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h2, h3 { color: var(--gold); margin-top: 0; }

        input, select, textarea { 
            width: 100%; padding: 14px; margin: 12px 0; 
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px; color: white; font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--gold); outline: none; }

        .btn-gold { 
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(to right, var(--gold), var(--dark-gold));
            color: var(--midnight); font-weight: 800; cursor: pointer;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.4); }

        /* --- Listings --- */
        .listing-card { 
            background: var(--glass); border-radius: 18px; overflow: hidden; 
            border: 1px solid rgba(212,175,55,0.1); margin-bottom: 25px;
        }
        .img-box { height: 210px; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .v-badge { 
            position: absolute; top: 15px; left: 15px; 
            background: var(--gold); color: var(--midnight);
            padding: 4px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 900;
        }
        .listing-info { padding: 15px; }
        .price-text { color: var(--gold); font-size: 1.4rem; font-weight: 800; }

        /* --- Footer & Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: #0a0e17; 
            display: flex; justify-content: space-around; padding: 15px 0;
            border-top: 1px solid var(--gold);
        }
        .nav-link { background: none; border: none; color: #666; font-size: 0.7rem; cursor: pointer; }
        .nav-link.active { color: var(--gold); font-weight: bold; }

        .warning-box { background: rgba(255, 0, 0, 0.1); border: 1px solid #ef4444; padding: 12px; border-radius: 10px; font-size: 0.8rem; margin: 15px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="app-header">
    <div class="brand">KEJA YANGU</div>
    <button onclick="auth.signOut()" id="logout-btn" style="display:none; background:none; border:1px solid var(--gold); color:var(--gold); padding:5px 10px; border-radius:8px; cursor:pointer;">Exit</button>
</header>

<div class="container">
    <div id="view-auth" class="view-section" style="display: block;">
        <div class="card">
            <h2>Portal Access</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            
            <div id="role-selector" style="display: none;">
                <p style="font-size: 0.8rem; color: var(--gold); margin-bottom: 0;">Registering as:</p>
                <select id="role">
                    <option value="student">🎓 Student (Finding Room)</option>
                    <option value="landlord">🏠 Landlord (Posting Room)</option>
                </select>
            </div>

            <button onclick="processAuth()" id="auth-main-btn" class="btn-gold">Sign In</button>
            
            <div style="display:flex; justify-content:space-between; margin-top:20px; font-size:0.8rem;">
                <span onclick="toggleMode()" id="mode-text" style="color:var(--gold); cursor:pointer;">Create Account</span>
                <span onclick="resetPassword()" style="color:var(--gold); cursor:pointer;">Forgot Password?</span>
            </div>
        </div>
    </div>

    <div id="view-student" class="view-section">
        <input type="text" id="search" placeholder="🔍 Search Hostels..." onkeyup="loadMarket()">
        <div id="market-list"></div>
    </div>

    <div id="view-landlord" class="view-section">
        <div class="card">
            <h3>New Listing</h3>
            <input type="text" id="h-name" placeholder="Hostel Name">
            <input type="number" id="h-price" placeholder="Rent (Ksh)">
            <input type="text" id="h-phone" placeholder="WhatsApp (254...)">
            <input type="text" id="h-dist" placeholder="Distance (e.g. 5 min walk)">
            <textarea id="h-imgs" placeholder="Image URLs (One per line)"></textarea>
            <button onclick="uploadHouse()" class="btn-gold">Post to Market</button>
        </div>
        <div id="landlord-list"></div>
    </div>

    <div id="view-admin" class="view-section">
        <div class="card">
            <h2>👑 Admin Central</h2>
            <div id="admin-stats" style="color:var(--gold); margin-bottom:20px;"></div>
            <div id="admin-listings"></div>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="nav" style="display: none;">
    <button class="nav-link active" onclick="show('view-student')">🏠<br>Browse</button>
    <button id="nav-post" class="nav-link" onclick="show('view-landlord')">➕<br>Manage</button>
    <button id="nav-admin" class="nav-link" onclick="show('view-admin')" style="display:none; color:var(--gold);">👑<br>Admin</button>
</nav>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCC8SA7FKzikzHwvA9A6dyrv0x2jguyPPQ",
        authDomain: "murang-a-student-housing.firebaseapp.com",
        projectId: "murang-a-student-housing",
        storageBucket: "murang-a-student-housing.appspot.com",
        messagingSenderId: "340466154926",
        appId: "1:340466154926:web:ea439a7f40ea64a13d5c3f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const ADMIN = "jonahnjugi100@gmail.com";

    let isRegistering = false;
    let allHouses = [];

    // --- Core Logic ---
    auth.onAuthStateChanged(async user => {
        if(user) {
            document.getElementById('logout-btn').style.display = 'block';
            document.getElementById('nav').style.display = 'flex';
            
            const doc = await db.collection('users').doc(user.uid).get();
            const data = doc.data();

            // Role Handling
            document.getElementById('nav-post').style.display = (data?.role === 'landlord') ? 'block' : 'none';
            document.getElementById('nav-admin').style.display = (user.email === ADMIN) ? 'block' : 'none';

            if(user.email === ADMIN) show('view-admin');
            else if(data?.role === 'landlord') show('view-landlord');
            else show('view-student');

            fetchData();
        } else {
            show('view-auth');
            document.getElementById('nav').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
        }
    });

    function toggleMode() {
        isRegistering = !isRegistering;
        document.getElementById('role-selector').style.display = isRegistering ? 'block' : 'none';
        document.getElementById('auth-main-btn').innerText = isRegistering ? 'Create Account' : 'Sign In';
        document.getElementById('mode-text').innerText = isRegistering ? 'Back to Login' : 'Create Account';
    }

    async function processAuth() {
        const email = document.getElementById('email').value, pass = document.getElementById('password').value;
        if(isRegistering) {
            const role = document.getElementById('role').value;
            auth.createUserWithEmailAndPassword(email, pass).then(u => {
                db.collection('users').doc(u.user.uid).set({ email, role });
            }).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
    }

    function resetPassword() {
        const e = document.getElementById('email').value;
        if(!e) return alert("Enter email first");
        auth.sendPasswordResetEmail(e).then(() => alert("Reset link sent!"));
    }

    function show(id) {
        document.querySelectorAll('.view-section').forEach(v => v.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function fetchData() {
        db.collection('houses').orderBy('createdAt', 'desc').onSnapshot(snap => {
            allHouses = snap.docs.map(d => ({id: d.id, ...d.data()}));
            loadMarket();
            if(auth.currentUser.email === ADMIN) loadAdmin();
        });
    }

    function loadMarket() {
        const list = document.getElementById('market-list');
        list.innerHTML = "";
        allHouses.forEach(h => {
            list.innerHTML += `
                <div class="listing-card">
                    <div class="img-box">
                        <span class="v-badge">VERIFIED</span>
                        <img src="${h.images[0]}" onerror="this.src='https://via.placeholder.com/400x200'">
                    </div>
                    <div class="listing-info">
                        <div class="price-text">Ksh ${h.price}</div>
                        <h3 style="margin:5px 0;">${h.name}</h3>
                        <p style="font-size:0.8rem; color:#888;">📍 ${h.dist}</p>
                        <button class="btn-gold" style="padding:10px;" onclick="window.open('https://wa.me/${h.phone}')">WhatsApp</button>
                    </div>
                </div>`;
        });
    }

    async function uploadHouse() {
        const urls = document.getElementById('h-imgs').value.split('\n').filter(u => u.trim() !== "");
        await db.collection('houses').add({
            name: document.getElementById('h-name').value,
            price: document.getElementById('h-price').value,
            phone: document.getElementById('h-phone').value,
            dist: document.getElementById('h-dist').value,
            images: urls,
            ownerId: auth.currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Published!");
    }

    function loadAdmin() {
        const div = document.getElementById('admin-listings');
        div.innerHTML = "";
        allHouses.forEach(h => {
            div.innerHTML += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <span>${h.name}</span>
                <button onclick="db.collection('houses').doc('${h.id}').delete()" style="color:red; background:none; border:none; cursor:pointer;">DELETE</button>
            </div>`;
        });
    }
</script>
</body>
</html>
