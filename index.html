<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keja Yangu | Murang'a Student Housing</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --navy: #1a237e; --red: #d32f2f; --bg: #f4f7f9; --success: #25d366; --blue-tick: #2196F3; --gray: #7f8c8d; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Brand Styling */
        .header-brand { text-align: center; padding: 15px 0; }
        .logo-img { width: 90px; height: auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .brand-name { color: var(--navy); margin-top: 8px; font-weight: 800; font-size: 1.6rem; letter-spacing: 1px; }
        .admin-badge { background: #ffd700; color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; display: none; margin: 5px auto; width: fit-content; }

        /* Card System */
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); display: none; margin-bottom: 20px; border: 1px solid #eee; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select, .btn { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn-primary { background: var(--navy); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); }
        
        /* Marketplace */
        .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .house-card { background: white; border-radius: 18px; overflow: hidden; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .house-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .house-info { padding: 15px; }
        .price { color: var(--red); font-size: 1.3rem; font-weight: 800; }
        .verified-tick { color: var(--blue-tick); font-size: 1.1rem; margin-left: 4px; }
        
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-wa { background: var(--success); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; }
        .btn-map { background: var(--navy); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; }
        .btn-report { background: #fff1f1; color: var(--red); border: none; font-size: 0.75rem; margin-top: 10px; cursor: pointer; border-radius: 5px; padding: 5px; }

        /* Admin Dashboard */
        .admin-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .report-item { background: #fff5f5; border-left: 4px solid var(--red); padding: 10px; margin-top: 10px; border-radius: 5px; }

        /* Footer & Contact */
        footer { margin-top: auto; padding: 20px; text-align: center; font-size: 0.85rem; color: #7f8c8d; }
        .contact-box { background: #e8eaf6; padding: 15px; border-radius: 15px; margin-top: 10px; text-align: left; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <img src="https://i.ibb.co/3mKNG8nV/House-logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25694.png'" class="logo-img">
        <div class="brand-name">KEJA YANGU</div>
        <div id="admin-tag" class="admin-badge">ADMINISTRATOR</div>
    </div>

    <div id="auth-screen" class="card" style="display: block;">
        <h3 style="margin-top:0;">Sign In</h3>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <select id="role">
            <option value="student">I am a Student</option>
            <option value="landlord">I am a Landlord</option>
        </select>
        <button onclick="authAction('login')" class="btn btn-primary">Login</button>
        <button onclick="authAction('signup')" class="btn" style="background:none; color:var(--navy); border:1px solid var(--navy);">Create Account</button>
        <p onclick="forgotPassword()" style="text-align:center; font-size:0.8rem; color:var(--gray); cursor:pointer; margin-top:10px;">Forgot Password?</p>
    </div>

    <div id="admin-screen" class="card">
        <h3 style="color:var(--navy)">Admin Control Panel</h3>
        <div id="admin-user-list"></div>
        <hr>
        <h4>Pending Reports</h4>
        <div id="admin-reports"></div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; font-weight:bold;">Logout</button>
    </div>

    <div id="student-screen" class="card">
        <div class="filter-row">
            <input type="text" id="search" placeholder="🔍 Search..." onkeyup="drawMarket()" style="margin:0;">
            <select id="price-filter" onchange="drawMarket()" style="margin:0;">
                <option value="all">Any Price</option>
                <option value="0-3000">Under 3k</option>
                <option value="3000-5000">3k - 5k</option>
                <option value="5000+">5k+</option>
            </select>
        </div>
        <div id="market-list"></div>
        <hr>
        <div class="contact-box">
            <strong>📞 Contact Support:</strong><br>
            Issues? Call/WhatsApp: 0720 680 769<br>
            Email: jonahnjugi100@gmail.com
        </div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; font-weight:bold; margin-top:15px;">Logout</button>
    </div>

    <div id="landlord-screen" class="card">
        <h3>Post New Property</h3>
        <input type="text" id="h-name" placeholder="House/Hostel Name">
        <input type="number" id="h-price" placeholder="Monthly Rent (Ksh)">
        <input type="text" id="h-phone" placeholder="WhatsApp Number (e.g. 254...)">
        <input type="text" id="h-dist" placeholder="Distance from Gate">
        <input type="text" id="h-img" placeholder="Photo URL (ImgBB Direct Link)">
        <input type="text" id="h-map" placeholder="Google Maps Link (Optional)">
        <button onclick="saveHouse()" class="btn btn-primary">Publish Listing</button>
        <hr>
        <div id="landlord-list"></div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; font-weight:bold;">Logout</button>
    </div>

    <footer>
        <p>&copy; 2025 Keja Yangu | Built by Jonah Njugi</p>
    </footer>
</div>

<script>
    // --- CONFIGURATION ---
    const ADMIN_EMAIL = "jonahnjugi100@gmail.com";
    const firebaseConfig = {
        apiKey: "AIzaSyCC8SA7FKzikzHwvA9A6dyrv0x2jguyPPQ",
        authDomain: "murang-a-student-housing.firebaseapp.com",
        projectId: "murang-a-student-housing",
        storageBucket: "murang-a-student-housing.appspot.com",
        messagingSenderId: "340466154926",
        appId: "1:340466154926:web:ea439a7f40ea64a13d5c3f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let houses = [];
    let usersMap = {};

    // --- AUTH LOGIC ---
    auth.onAuthStateChanged(async user => {
        document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        document.getElementById('admin-tag').style.display = 'none';

        if(!user) {
            document.getElementById('auth-screen').style.display = 'block';
        } else {
            if(user.email === ADMIN_EMAIL) {
                document.getElementById('admin-screen').style.display = 'block';
                document.getElementById('admin-tag').style.display = 'block';
                loadAdminData();
            } else {
                const doc = await db.collection('users').doc(user.uid).get();
                const role = doc.exists ? doc.data().role : 'student';
                document.getElementById(role + '-screen').style.display = 'block';
            }
            
            db.collection('users').onSnapshot(snap => {
                snap.forEach(doc => usersMap[doc.id] = doc.data());
                loadHouses();
            });
        }
    });

    // --- DATA LOADING ---
    function loadHouses() {
        db.collection('houses').orderBy('createdAt', 'desc').onSnapshot(snap => {
            houses = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            drawMarket();
            if(document.getElementById('landlord-list')) drawLandlordList();
        });
    }

    function drawMarket() {
        const container = document.getElementById('market-list');
        const query = document.getElementById('search').value.toLowerCase();
        const priceFilter = document.getElementById('price-filter').value;
        if(!container) return;
        container.innerHTML = "";

        const filtered = houses.filter(h => {
            const price = parseInt(h.price);
            const matchesSearch = h.name.toLowerCase().includes(query);
            let matchesPrice = (priceFilter === "all") || 
                (priceFilter === "0-3000" && price < 3000) ||
                (priceFilter === "3000-5000" && price >= 3000 && price <= 5000) ||
                (priceFilter === "5000+" && price > 5000);
            return matchesSearch && matchesPrice;
        });

        filtered.forEach(h => {
            const isV = usersMap[h.ownerId]?.isVerified;
            container.innerHTML += `
                <div class="house-card">
                    <img src="${h.img || 'https://via.placeholder.com/400x200'}" class="house-img">
                    <div class="house-info">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${h.name} ${isV ? '<span class="verified-tick">✔</span>' : ''}</strong>
                            <span class="price">Ksh ${h.price}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#666; margin:5px 0;">📍 ${h.dist}</div>
                        <div class="action-row">
                            <a href="https://wa.me/${h.phone}?text=Interested in ${h.name}" class="btn-wa" target="_blank">WhatsApp</a>
                            <a href="${h.map || 'javascript:alert(\'No map provided\')'}" class="btn-map" target="${h.map?'_blank':''}">View Map</a>
                        </div>
                        <button class="btn-report" onclick="reportHouse('${h.id}', '${h.name}')">🚩 Report Fake Listing</button>
                    </div>
                </div>`;
        });
    }

    // --- LANDLORD ACTIONS ---
    async function saveHouse() {
        const name = document.getElementById('h-name').value;
        const price = document.getElementById('h-price').value;
        const phone = document.getElementById('h-phone').value.replace(/\D/g,'');
        if(!name || !price || !phone) return alert("Fill Name, Price and WhatsApp");
        
        await db.collection('houses').add({
            name, price, phone, 
            dist: document.getElementById('h-dist').value,
            img: document.getElementById('h-img').value,
            map: document.getElementById('h-map').value,
            ownerId: auth.currentUser.uid,
            createdAt: new Date()
        });
        alert("Published Successfully!");
    }

    // --- ADMIN ACTIONS ---
    function loadAdminData() {
        // Users list
        db.collection('users').where('role', '==', 'landlord').onSnapshot(snap => {
            const list = document.getElementById('admin-user-list');
            list.innerHTML = "<h4>Landlords</h4>";
            snap.forEach(doc => {
                const u = doc.data();
                list.innerHTML += `<div class="admin-row">
                    <span>${u.email}</span>
                    <button onclick="toggleVerify('${doc.id}', ${!u.isVerified})">${u.isVerified ? '✅ Verified' : '❌ Verify'}</button>
                </div>`;
            });
        });
        // Reports list
        db.collection('reports').where('status', '==', 'pending').onSnapshot(snap => {
            const list = document.getElementById('admin-reports');
            list.innerHTML = "";
            snap.forEach(doc => {
                const r = doc.data();
                list.innerHTML += `<div class="report-item">
                    <b>${r.houseName}</b> reported by ${r.reportedBy}<br>
                    <button onclick="deleteHouseAndResolve('${r.houseId}', '${doc.id}')" style="background:red; color:white; border:none; border-radius:5px; margin-top:5px;">DELETE LISTING</button>
                </div>`;
            });
        });
    }

    function toggleVerify(uid, status) { db.collection('users').doc(uid).update({ isVerified: status }); }
    
    async function reportHouse(hid, hname) {
        if(confirm("Report this house to Admin?")) {
            await db.collection('reports').add({ houseId: hid, houseName: hname, reportedBy: auth.currentUser.email, status: 'pending', createdAt: new Date() });
            alert("Reported.");
        }
    }

    async function deleteHouseAndResolve(hid, rid) {
        if(confirm("Delete this house permanently?")) {
            await db.collection('houses').doc(hid).delete();
            await db.collection('reports').doc(rid).update({ status: 'resolved' });
        }
    }

    // --- AUTH UTILS ---
    function authAction(type) {
        const e = document.getElementById('email').value, p = document.getElementById('pass').value, r = document.getElementById('role').value;
        if(type === 'login') auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        else auth.createUserWithEmailAndPassword(e, p).then(res => db.collection('users').doc(res.user.uid).set({ email: e, role: r, isVerified: false }));
    }
    function forgotPassword() {
        const e = document.getElementById('email').value;
        if(e) auth.sendPasswordResetEmail(e).then(() => alert("Reset email sent!"));
        else alert("Enter email first.");
    }
</script>
</body>
</html>
