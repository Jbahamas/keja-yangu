<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keja Yangu | Murang'a Student Housing</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --navy: #1a237e; --red: #d32f2f; --bg: #f4f7f9; --success: #25d366; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Header & Logo Section */
        .header-brand { text-align: center; padding: 20px 0; }
        .logo-img { width: 120px; height: auto; border-radius: 15px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
        .brand-name { color: var(--navy); margin-top: 12px; font-weight: 800; font-size: 1.7rem; letter-spacing: 1px; }
        
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: none; margin-bottom: 20px; border: 1px solid #eee; }
        input, select, .btn { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn-primary { background: var(--navy); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Marketplace Layout */
        .house-card { background: white; border-radius: 18px; overflow: hidden; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: 0.3s; }
        .house-img { width: 100%; height: 230px; object-fit: cover; background: #eee; border-bottom: 1px solid #eee; }
        .house-info { padding: 18px; text-align: left; }
        .price { color: var(--red); font-size: 1.5rem; font-weight: 800; }
        
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .btn-wa { background: var(--success); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem; }
        .btn-map { background: var(--navy); color: white; text-decoration: none; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <img src="https://i.ibb.co/3mKNG8nV/House-logo.png" 
             onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25694.png'" 
             alt="Keja Yangu Logo" 
             class="logo-img">
        <div class="brand-name">KEJA YANGU</div>
        <p style="margin:0; font-size:0.9rem; color:#666; font-weight: 500;">Murang'a University Student Housing</p>
    </div>

    <div id="auth-screen" class="card" style="display: block;">
        <h3 style="margin-top:0; color: var(--navy);">Get Started</h3>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <select id="role">
            <option value="student">I am a Student</option>
            <option value="landlord">I am a Landlord</option>
        </select>
        <button onclick="authAction('login')" class="btn btn-primary">Sign In</button>
        <button onclick="authAction('signup')" class="btn" style="background:none; color:var(--navy); border:2px solid var(--navy);">Create Account</button>
    </div>

    <div id="student-screen" class="card">
        <h3 style="margin-top:0;">Find Your Keja</h3>
        <input type="text" id="search" placeholder="🔍 Search name or area..." onkeyup="drawMarket()">
        <div id="market-list"></div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; font-weight: bold;">Logout</button>
    </div>

    <div id="landlord-screen" class="card">
        <h3 style="margin-top:0;">Landlord Dashboard</h3>
        <div style="background:#f8f9fa; padding:15px; border-radius:15px; border:1px solid #eef;">
            <h4 style="margin-top:0;">Post New Listing</h4>
            <input type="text" id="h-name" placeholder="House Name">
            <input type="number" id="h-price" placeholder="Monthly Rent (Ksh)">
            <input type="text" id="h-dist" placeholder="Distance (e.g. 500m from gate)">
            <input type="text" id="h-img" placeholder="Paste House Photo URL">
            <input type="text" id="h-map" placeholder="Google Maps Link">
            <input type="text" id="h-amen" placeholder="Amenities (WiFi, Water, CCTV)">
            <button onclick="saveHouse()" class="btn btn-primary">Publish Property</button>
        </div>
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <div id="landlord-list"></div>
        <button onclick="auth.signOut()" class="btn" style="color:var(--red); border:none; background:none; margin-top:20px;">Logout</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCC8SA7FKzikzHwvA9A6dyrv0x2jguyPPQ",
        authDomain: "murang-a-student-housing.firebaseapp.com",
        projectId: "murang-a-student-housing",
        storageBucket: "murang-a-student-housing.appspot.com",
        messagingSenderId: "340466154926",
        appId: "1:340466154926:web:ea439a7f40ea64a13d5c3f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let houses = [];
    let currentRole = '';

    auth.onAuthStateChanged(async user => {
        document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        if(!user) {
            document.getElementById('auth-screen').style.display = 'block';
        } else {
            const doc = await db.collection('users').doc(user.uid).get();
            currentRole = doc.exists ? doc.data().role : 'student';
            document.getElementById(currentRole + '-screen').style.display = 'block';
            loadData();
        }
    });

    function loadData() {
        db.collection('houses').orderBy('createdAt', 'desc').onSnapshot(snap => {
            houses = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            drawMarket();
            if(currentRole === 'landlord') drawLandlordList();
        });
    }

    function drawMarket() {
        const query = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('market-list');
        if(!container) return;
        container.innerHTML = "";

        const filtered = houses.filter(h => h.name.toLowerCase().includes(query));
        if(filtered.length === 0) {
            container.innerHTML = "<p style='color:#999; padding:20px;'>No properties found.</p>";
            return;
        }

        filtered.forEach(h => {
            container.innerHTML += `
                <div class="house-card">
                    <img src="${h.img || 'https://via.placeholder.com/400x230?text=No+Photo'}" class="house-img">
                    <div class="house-info">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong style="font-size:1.2rem; color:var(--navy);">${h.name}</strong>
                            <span class="price">Ksh ${h.price}</span>
                        </div>
                        <div style="color:#666; margin:8px 0; font-size:0.9rem;">📍 ${h.dist || 'Walking distance'}</div>
                        <div class="action-row">
                            <a href="https://wa.me/254720680769?text=Hello, I am interested in ${h.name}" class="btn-wa">WhatsApp</a>
                            <a href="${h.map || '#'}" target="_blank" class="btn-map">Google Maps</a>
                        </div>
                    </div>
                </div>`;
        });
    }

    async function saveHouse() {
        const name = document.getElementById('h-name').value;
        const price = document.getElementById('h-price').value;
        const dist = document.getElementById('h-dist').value;
        const img = document.getElementById('h-img').value;
        const map = document.getElementById('h-map').value;
        const amenities = document.getElementById('h-amen').value;
        if(!name || !price) return alert("Please enter both the name and price.");
        
        await db.collection('houses').add({
            name, price, dist, img, map, amenities,
            ownerId: auth.currentUser.uid,
            createdAt: new Date()
        });
        alert("Listing published successfully!");
        document.getElementById('h-name').value = "";
    }

    function drawLandlordList() {
        const list = document.getElementById('landlord-list');
        list.innerHTML = "<h4>Your Properties</h4>";
        const myHouses = houses.filter(h => h.ownerId === auth.currentUser.uid);
        myHouses.forEach(h => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee; background:#fff;">
                <span style="font-weight: 600;">${h.name}</span>
                <button onclick="db.collection('houses').doc('${h.id}').delete()" style="color:red; border:none; background:none; cursor:pointer; font-weight:bold;">Remove</button>
            </div>`;
        });
    }

    function authAction(type) {
        const e = document.getElementById('email').value, p = document.getElementById('pass').value, r = document.getElementById('role').value;
        if(type === 'login') auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        else auth.createUserWithEmailAndPassword(e, p).then(res => db.collection('users').doc(res.user.uid).set({ role: r }));
    }
</script>
</body>
</html>
